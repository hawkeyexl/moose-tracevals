# House voice for every document in this repo. The Moose package enables the
# Voices core, the Direct voice, and the Moose house rules for all Markdown
# and text files. README, ADRs, CLAUDE.md, and the docs site are all held to
# the same voice.
# Package source: https://github.com/hawkeyexl/moose-vale
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/hawkeyexl/moose-vale/releases/latest/download/Moose.zip

# The one exemption. Fixture prose is test input, not house prose: CI asserts
# on its bytes, and `git diff --quiet` over the corpus is the staleness gate.
# Rewriting a fixture for voice would break the assertions it exists to make.
[test/fixtures/**]
BasedOnStyles =
