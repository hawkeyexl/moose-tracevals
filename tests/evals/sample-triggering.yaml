name: sample-skill-triggering
description: Sample eval spec for testing the framework
type: capability
artifact:
  type: skill
  path: ./nonexistent-skill.md

trials: 3
model: claude-sonnet-4-6
judge_model: claude-sonnet-4-6

cases:
  - name: triggers-on-relevant-prompt
    prompt: "Generate a test spec for docs/getting-started.md"
    criteria:
      - name: skill-triggered
        type: code
        grader: trigger-check
        config:
          skill_name: doc-detective-generate
          should_trigger: true

      - name: output-valid
        type: code
        grader: regex-match
        config:
          pattern: "test"
          expect: present

  - name: does-not-trigger-on-unrelated
    prompt: "What is the weather today?"
    criteria:
      - name: skill-not-triggered
        type: code
        grader: trigger-check
        config:
          skill_name: doc-detective-generate
          should_trigger: false
