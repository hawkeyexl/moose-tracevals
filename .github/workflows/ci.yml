name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # Developed on Windows, deployed in Linux CI: path building, session-store
    # scanning, and JSONL parsing all touch platform-specific ground, so test
    # the pair rather than trusting one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Git hooks are a local-dev concern; `prepare` should be a clean no-op here.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # npm install, not ci — the lockfile is authored on Windows, where npm
      # prunes optional-dependency subtrees; `npm ci`'s sync check then fails on
      # every runner. See CLAUDE.md.
      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The suite mocks the judge provider and injects prompts, so it never
      # reaches the network. Prove the built CLI works end to end against the
      # fixture corpus — this is what catches a broken bin entry, a bad dist
      # build, or a module that only resolves under vitest.
      # Exit 1 is the expected, asserted outcome: the fixture project declares
      # one deterministic eval the fixture trace deliberately violates.
      - name: Dogfood run (deterministic graders)
        shell: bash
        env:
          # Resolve user-level artifacts (the fixture plugin skill) from the
          # fixture home on every machine, not the runner's real home.
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        # Paths are relative on purpose: on windows-latest Git Bash and node.exe
        # resolve absolute POSIX paths differently. See CLAUDE.md.
        run: |
          set +e
          node dist/cli.js run test/fixtures/traces/claude-session.jsonl --project test/fixtures/project --deterministic-only --format json > moose-tracevals-run.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 from the fixture corpus, got $code"
            cat moose-tracevals-run.json
            exit 1
          fi
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-run.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1); // tolerate a BOM
            const r = JSON.parse(raw);
            const find = (a, e) => r.evalResults.find((x) => x.artifact.endsWith(a) && x.evalName === e);
            const check = (label, actual, expected) => {
              if (actual !== expected) {
                console.error(`${label}: expected ${expected}, got ${actual}`);
                process.exitCode = 1;
              }
            };
            // The fixture skill declares a tool-usage eval the trace violates.
            check("SKILL.md forbidden-tool", find("SKILL.md", "forbidden-tool")?.outcome, "fail");
            // Scoped grading (ADR 01015): the trace runs Bash twice, once
            // before the skill was ever invoked. Only the in-window call may
            // count, so the *count* — not just the verdict — is the assertion.
            const forbiddenMsg = find("SKILL.md", "forbidden-tool")?.findings?.[0]?.message ?? "";
            if (!/used 1 time\(s\)/.test(forbiddenMsg)) {
              console.error(`forbidden-tool must count only the in-window Bash, got: ${forbiddenMsg}`);
              process.exitCode = 1;
            }
            // And one it satisfies.
            check("SKILL.md used-read", find("SKILL.md", "used-read")?.outcome, "pass");
            // An agent is graded against its own branch: the parent session ran
            // Edit, the reviewer branch only read. Unwindowed, this is a fail.
            check("reviewer.md read-only", find("reviewer.md", "reviewer-is-read-only")?.outcome, "pass");
            check("reviewer.md read-something", find("reviewer.md", "reviewer-read-something")?.outcome, "pass");
            // And an agent that spawned no branch governed nothing: every eval
            // on it must say so. `doc-writer-wrote-docs` would otherwise pass
            // on a file the *parent* wrote — the exact false pass windowing
            // exists to prevent, so a silent `pass` here is the regression.
            for (const name of ["doc-writer-wrote-docs", "doc-writer-followed-its-brief"]) {
              const empty = find("doc-writer.md", name);
              check(`doc-writer.md ${name}`, empty?.outcome, "skipped");
              if (!/no subagent turns/.test(empty?.skipReason ?? "")) {
                console.error(`${name}: expected an empty-window reason, got ${empty?.skipReason}`);
                process.exitCode = 1;
              }
            }
            // Conditional triggers (ADR 01016). The session edited src/app.ts
            // and invoked fix-bug, so this one armed and passed.
            check("CLAUDE.md armed trigger", find("CLAUDE.md", "source-edits-use-the-fix-bug-skill")?.outcome, "pass");
            // And the one armed on docs/** never fired. It must be `skipped`
            // with the reason stated — a `pass` here is the regression that
            // would silently gut the feature, since a check that never armed
            // has not been satisfied.
            const unarmed = find("CLAUDE.md", "docs-work-uses-the-writing-skill");
            check("CLAUDE.md unarmed trigger", unarmed?.outcome, "skipped");
            if (!/trigger not met/.test(unarmed?.skipReason ?? "")) {
              console.error(`unarmed trigger: expected a trigger-not-met reason, got ${unarmed?.skipReason}`);
              process.exitCode = 1;
            }
            // The three coverage states, never collapsed. `doc-writer` is
            // spawned and resolves on disk but was never on the roster: a
            // configuration bug, not an adherence failure.
            const availabilityOf = (ref) => r.coverage.find((c) => c.ref === ref)?.availability;
            check("fix-bug availability", availabilityOf("fix-bug"), "offered-and-used");
            check("doc-writer availability", availabilityOf("doc-writer"), "not-offered");
            // Offered-but-unused is counted, not listed, unless asked for.
            check("roster recorded", r.availability?.recorded, true);
            check("skills offered", r.availability?.skills?.offered, 5);
            check("skills unused", r.availability?.skills?.unused, 3);
            check("roster listed", r.availability?.listed, false);
            if (r.coverage.some((c) => c.availability === "offered-not-used")) {
              console.error("offered-but-unused artifacts must be summarised, not listed, by default");
              process.exitCode = 1;
            }
            // A command-graded eval really spawns its check script over {trace}.
            check("SKILL.md no-force-push", find("SKILL.md", "no-force-push")?.outcome, "pass");
            check("SKILL.md no-force-push grader", find("SKILL.md", "no-force-push")?.grader, "command");
            // `human` is judged per session: it queues for review, never passes
            // silently, and reports even in a deterministic-only run.
            check("SKILL.md refactor-preserved-intent", find("SKILL.md", "refactor-preserved-intent")?.outcome, "needs-review");
            // The single-string block shorthand plans one id-less ai eval.
            check("AGENTS.md shorthand", find("AGENTS.md", "eval-1")?.grader, "ai");
            // metadata.eval-skip is reported as skipped, never silently dropped.
            const pluginSkill = r.evalResults.find((x) => x.artifactName === "writing-toolkit:identify-ai-tells");
            check("plugin skill eval-skip", pluginSkill?.outcome, "skipped");
            if (!/eval-skip/.test(pluginSkill?.skipReason ?? "")) {
              console.error(`plugin skill: expected an eval-skip reason, got ${pluginSkill?.skipReason}`);
              process.exitCode = 1;
            }
            // AI-graded evals are skipped under --deterministic-only, not failed.
            const skipped = r.evalResults.filter((x) => x.outcome === "skipped");
            if (skipped.length === 0) { console.error("expected skipped ai evals under --deterministic-only"); process.exitCode = 1; }
            // Nothing errored: an unknown grader or an unrunnable command would
            // land here rather than in a verdict.
            const errored = r.evalResults.filter((x) => x.outcome === "error");
            if (errored.length > 0) {
              console.error("unexpected errored evals:", JSON.stringify(errored, null, 2));
              process.exitCode = 1;
            }
          '

      # `--report-unused-artifacts` is the opt-in half of the same observation:
      # the full roster is what a 274-skill session would drown the report with,
      # so it must stay behind the flag — and must never move the exit code.
      - name: Dogfood run (offered-but-unused artifacts)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        run: |
          set +e
          node dist/cli.js run test/fixtures/traces/claude-session.jsonl --project test/fixtures/project --deterministic-only --report-unused-artifacts --format json > moose-tracevals-unused.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 (unchanged by an observation), got $code"
            cat moose-tracevals-unused.json
            exit 1
          fi
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-unused.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            if (r.availability?.listed !== true) { console.error("expected listed: true"); process.exitCode = 1; }
            const unused = r.coverage.filter((c) => c.availability === "offered-not-used");
            const want = ["deep-research", "bare-listing", "tdd-coverage", "researcher"];
            if (JSON.stringify(unused.map((c) => c.ref)) !== JSON.stringify(want)) {
              console.error("unexpected offered-but-unused list:", JSON.stringify(unused, null, 2));
              process.exitCode = 1;
            }
            // The description is the point: it is the criterion Claude Code
            // itself uses to decide whether to invoke.
            if (!/Fan-out web searches/.test(unused[0]?.note ?? "")) {
              console.error(`expected the roster description in the note, got ${unused[0]?.note}`);
              process.exitCode = 1;
            }
            // Nothing was looked for on disk, so an unused row claims nothing
            // about resolution.
            if (unused.some((c) => c.tried.length > 0)) {
              console.error("an offered-but-unused row must not claim a filesystem search");
              process.exitCode = 1;
            }
            // A truncated listing names a skill with no description at all.
            const bare = unused.find((c) => c.ref === "bare-listing");
            if (bare?.note !== "offered, never used") {
              console.error(`expected a bare note for a description-less skill, got ${bare?.note}`);
              process.exitCode = 1;
            }
          '

      - name: Dogfood run (mock judge)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        run: |
          set +e
          node dist/cli.js run test/fixtures/traces/claude-session.jsonl --project test/fixtures/project --provider mock --format json > moose-tracevals-mock.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 (deterministic failure persists), got $code"
            cat moose-tracevals-mock.json
            exit 1
          fi
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-mock.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            const judged = r.evalResults.filter((x) => x.consensus);
            if (judged.length === 0) { console.error("expected judged evals with consensus objects"); process.exitCode = 1; }
            // An ai eval whose artifact governed no turn never reaches the
            // judge: no consensus object, a skip with a stated reason. A judge
            // handed an empty window would answer about the parent session.
            const empty = r.evalResults.find((x) => x.evalName === "doc-writer-followed-its-brief");
            if (empty?.outcome !== "skipped" || empty?.consensus !== undefined) {
              console.error("an empty window must be skipped before the judge, got:", JSON.stringify(empty));
              process.exitCode = 1;
            }
          '

      # `fill` is the only command that writes, so the gate proves two things:
      # that it discovers exactly the instruction artifacts (and no plain
      # docs), and that a default run leaves the corpus byte-identical.
      - name: Dogfood fill (dry run, corpus must not change)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        run: |
          # --no-cache is load-bearing: `npm test` runs earlier in this job and
          # would otherwise leave a populated cache, turning this gate into a
          # replay that never exercises the provider wiring in dist/.
          set +e
          node dist/cli.js fill test/fixtures/project --provider mock --dry-run --no-cache --format json > moose-tracevals-fill.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Expected exit 0 from a dry-run fill, got $code"
            cat moose-tracevals-fill.json
            exit 1
          fi
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-fill.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            const paths = r.results.map((x) => x.artifact.replace(/\\/g, "/"));
            const want = ["fix-bug/SKILL.md", "doc-writer.md", "CLAUDE.md", "AGENTS.md"];
            for (const suffix of want) {
              if (!paths.some((p) => p.endsWith(suffix))) {
                console.error(`expected to discover ${suffix}`);
                process.exitCode = 1;
              }
            }
            // A plain doc is not an instruction artifact.
            if (paths.some((p) => p.endsWith("README.md"))) {
              console.error("README.md must not be discovered as an artifact");
              process.exitCode = 1;
            }
            if (r.dryRun !== true) { console.error("expected dryRun: true"); process.exitCode = 1; }
            // Project rules are proposed, never written.
            const rules = r.results.filter((x) => x.type === "project-rules");
            if (rules.length === 0 || !rules.every((x) => x.status === "propose-only")) {
              console.error("project rules must be propose-only");
              process.exitCode = 1;
            }
            // Proves the gate ran instead of rubber-stamping the proposal.
            const reasons = r.results.flatMap((x) => x.rejected.map((y) => y.reason));
            if (!reasons.includes("low-confidence")) {
              console.error("expected at least one low-confidence rejection");
              process.exitCode = 1;
            }
            if (!r.results.some((x) => x.needsSharpening.length > 0)) {
              console.error("expected at least one needs-sharpening note");
              process.exitCode = 1;
            }
          '
          # The assertion that actually protects the corpus: if dry-run ever
          # stops being honoured, this fails loudly rather than silently
          # rewriting the fixtures. --porcelain, not `diff --quiet`, so a
          # newly *created* file inside the corpus is caught too.
          dirty=$(git status --porcelain -- test/fixtures/project)
          if [ -n "$dirty" ]; then
            echo "fill modified the fixture corpus during a dry run:"
            echo "$dirty"
            git --no-pager diff -- test/fixtures/project
            exit 1
          fi

      # The dry-run gate above never exercises the write path. Fill a scratch
      # copy for real, then prove the output is consumable by the reader: this
      # is the round trip that matters, checked on both OS legs.
      - name: Dogfood fill (write path, on a scratch copy)
        shell: bash
        run: |
          rm -rf .tmp/fill-ci && mkdir -p .tmp/fill-ci
          cp -r test/fixtures/project .tmp/fill-ci/project
          node dist/cli.js fill .tmp/fill-ci/project --provider mock --no-cache --format json > moose-tracevals-fill-write.json
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-fill-write.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            const filled = r.results.filter((x) => x.status === "filled");
            if (filled.length === 0) { console.error("expected at least one filled artifact"); process.exitCode = 1; }
            // Project rules must stay propose-only even on the write path.
            if (r.results.some((x) => x.type === "project-rules" && x.status === "filled")) {
              console.error("project rules must never be written");
              process.exitCode = 1;
            }
          '
          # Machines propose, humans retire the trail: what fill writes must
          # carry its own attribution, or a reviewer cannot tell an unreviewed
          # suggestion from an eval someone signed off on.
          node -e '
            const fs = require("fs");
            const path = ".tmp/fill-ci/project/.claude/agents/doc-writer.md";
            const text = fs.readFileSync(path, "utf8");
            for (const want of ["eval-provenance", "generated-by", "confidence"]) {
              if (!text.includes(want)) {
                console.error(`expected ${want} in the filled artifact:\n${text}`);
                process.exitCode = 1;
              }
            }
            // The 0.2 spellings must not reappear through the write path.
            if (/^\s*criteria:/m.test(text) || /^\s*- name:/m.test(text)) {
              console.error(`filled artifact used the retired 0.2 spelling:\n${text}`);
              process.exitCode = 1;
            }
          '
          # The written frontmatter must still parse and plan.
          node dist/cli.js run test/fixtures/traces/claude-session.jsonl --project .tmp/fill-ci/project --deterministic-only --format json > moose-tracevals-postfill.json || true
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-postfill.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            const errored = r.evalResults.filter((x) => x.outcome === "error");
            if (errored.length > 0) {
              console.error("filled evals did not survive a real run:", JSON.stringify(errored, null, 2));
              process.exitCode = 1;
            }
            if (!r.evalResults.some((x) => x.evalName === "reads-before-editing")) {
              console.error("expected the filled eval to be planned and graded");
              process.exitCode = 1;
            }
          '
          rm -rf .tmp/fill-ci
          # And the real corpus is still untouched.
          dirty=$(git status --porcelain -- test/fixtures/project)
          if [ -n "$dirty" ]; then
            echo "the write-path gate leaked into the real corpus:"; echo "$dirty"; exit 1
          fi

      # Modern Claude Code writes subagent turns to a sidecar directory rather
      # than inline in the session file, so this asserts the merge really runs
      # through the built CLI: a branch spawned from *inside* another sidecar
      # must reach artifact resolution, and a malformed sidecar must degrade to
      # a warning instead of failing the run (ADR 01014).
      - name: Dogfood run (subagent sidecar transcripts)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        run: |
          set +e
          node dist/cli.js run test/fixtures/traces/claude-session-sidecar.jsonl --project test/fixtures/project --deterministic-only --format json > moose-tracevals-sidecar.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Expected exit 0 from the sidecar fixture, got $code"
            cat moose-tracevals-sidecar.json
            exit 1
          fi
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-sidecar.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            // A depth-2 agent whose Agent call exists only inside the depth-1
            // sidecar. Seeing it here proves the merge fed artifact resolution.
            if (!r.coverage.some((c) => c.kind === "agent" && c.ref === "general-purpose")) {
              console.error("expected the nested subagent to reach artifact coverage");
              console.error(JSON.stringify(r.coverage, null, 2));
              process.exitCode = 1;
            }
            // Both degradation shapes must warn, not throw and not pass silently.
            const warned = (needle) => r.warnings.some((w) => w.includes(needle));
            for (const needle of ["is unreadable or not an object", "which is not in this trace"]) {
              if (!warned(needle)) {
                console.error(`expected a degradation warning containing: ${needle}`);
                console.error(JSON.stringify(r.warnings, null, 2));
                process.exitCode = 1;
              }
            }
          '

      # `registerGrader` is exported and documented, but until ADR 01017 there
      # was no way to reach it from the CLI — so a repo could write a custom
      # grader and still not use it in CI. This proves both halves through the
      # built binary: the same corpus errors without the plugin and passes with
      # it, from the flag and from the config alike.
      - name: Dogfood run (grader plugins)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/plugin-project
        run: |
          trace=test/fixtures/traces/claude-session.jsonl
          # 1. The gap. A declared custom kind with nothing loading it is an
          #    errored eval — never a silent pass.
          set +e
          node dist/cli.js run "$trace" --project test/fixtures/plugin-project --deterministic-only --format json > moose-tracevals-plugin-off.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 without the plugin, got $code"; cat moose-tracevals-plugin-off.json; exit 1
          fi

          # 2. --require closes it, and nothing else about the corpus changed.
          node dist/cli.js run "$trace" --project test/fixtures/plugin-project --deterministic-only --require ./test/fixtures/plugins/stayed-in-scope.mjs --format json > moose-tracevals-plugin-on.json

          # 3. The same plugin named by the config instead, run from the
          #    project directory: `../plugins/…` only resolves if specifiers
          #    are taken relative to the config file, not the working
          #    directory. Run from the repo root it would resolve to nothing.
          ( cd test/fixtures/plugin-project && MOOSE_TRACEVALS_HOME=. node ../../../dist/cli.js run ../traces/claude-session.jsonl --project . --deterministic-only --format json ) > moose-tracevals-plugin-config.json

          node -e '
            const fs = require("fs");
            const read = (f) => {
              let raw = fs.readFileSync(f, "utf8");
              if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
              return JSON.parse(raw);
            };
            const evalOf = (r) => r.evalResults.find((x) => x.evalName === "stayed-in-the-worktree");
            const check = (label, actual, expected) => {
              if (actual !== expected) {
                console.error(`${label}: expected ${expected}, got ${actual}`);
                process.exitCode = 1;
              }
            };
            const off = evalOf(read("moose-tracevals-plugin-off.json"));
            check("no plugin outcome", off?.outcome, "error");
            if (!/unknown grader kind/.test(off?.error ?? "")) {
              console.error(`no plugin: expected the registry error, got: ${off?.error}`);
              process.exitCode = 1;
            }
            for (const file of ["moose-tracevals-plugin-on.json", "moose-tracevals-plugin-config.json"]) {
              const r = read(file);
              check(`${file} outcome`, evalOf(r)?.outcome, "pass");
              check(`${file} exit`, r.exitCode, 0);
              // A plugin that loaded but registered nothing would still pass
              // the check above by accident on a corpus with no custom eval;
              // here it would surface as this warning.
              if (r.warnings.some((w) => /registered no grader kinds/.test(w))) {
                console.error(`${file}: the plugin registered nothing`);
                process.exitCode = 1;
              }
            }
          '

          # 4. A plugin that will not load is operational (exit 2), and says so
          #    in words that cannot be mistaken for a typo'd grader kind — the
          #    two are neighbours, and conflating them sends the reader to the
          #    wrong file.
          set +e
          node dist/cli.js run "$trace" --project test/fixtures/plugin-project --deterministic-only --require ./test/fixtures/plugins/not-here.mjs > /dev/null 2> moose-tracevals-plugin-err.txt
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit 2 from an unloadable plugin, got $code"; cat moose-tracevals-plugin-err.txt; exit 1
          fi
          grep -q "could not load grader plugin" moose-tracevals-plugin-err.txt || {
            echo "missing the plugin-load error:"; cat moose-tracevals-plugin-err.txt; exit 1
          }
          if grep -q "unknown grader kind" moose-tracevals-plugin-err.txt; then
            echo "a load failure must not read as a grader-not-found error:"
            cat moose-tracevals-plugin-err.txt
            exit 1
          fi

      # Adherence is a rate, not a verdict (ADR 01018). This proves the batch
      # path through the built binary: the aggregate shape, a rate computed
      # over a corpus engineered to fail on one trace and pass on the other, a
      # single-trace run that did *not* change shape, an unreadable file
      # degrading beside good ones, and the judge budget reaching the shared
      # judge instead of being rebuilt per trace.
      - name: Dogfood run (batch over many traces)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        run: |
          a=test/fixtures/traces/claude-session.jsonl
          b=test/fixtures/traces/claude-session-sidecar.jsonl

          # 1. Two named traces: exit 1 because one of them fails, and the
          #    report is the aggregate shape.
          set +e
          node dist/cli.js run "$a" "$b" --project test/fixtures/project --deterministic-only --format json > moose-tracevals-batch.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 from a batch containing the failing fixture, got $code"
            cat moose-tracevals-batch.json
            exit 1
          fi

          # 2. One named trace must still be the single-trace report. Many
          #    assertions above and every documented example depend on it.
          node dist/cli.js run "$b" --project test/fixtures/project --deterministic-only --format json > moose-tracevals-batch-single.json

          # 3. A file that is not a trace at all, batched with two that are.
          mkdir -p .tmp && printf 'not a trace\n' > .tmp/bad-trace.jsonl
          set +e
          node dist/cli.js run .tmp/bad-trace.jsonl "$a" "$b" --project test/fixtures/project --deterministic-only --format json > moose-tracevals-batch-degraded.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 from a batch with an unreadable trace, got $code"; exit 1
          fi

          # 4. The judge budget must reach the one shared judge. Zero is the
          #    only budget a mock provider can exhaust, but it still proves the
          #    flag is plumbed through the batch rather than dropped.
          set +e
          node dist/cli.js run "$a" "$b" --project test/fixtures/project --provider mock --max-cost-usd 0 --format json > moose-tracevals-batch-budget.json
          set -e

          node -e '
            const fs = require("fs");
            const read = (f) => {
              let raw = fs.readFileSync(f, "utf8");
              if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
              return JSON.parse(raw);
            };
            const check = (label, actual, expected) => {
              if (actual !== expected) {
                console.error(`${label}: expected ${expected}, got ${actual}`);
                process.exitCode = 1;
              }
            };

            const batch = read("moose-tracevals-batch.json");
            check("batch traces", batch.summary.traces, 2);
            check("batch tracesFailed", batch.summary.tracesFailed, 1);
            check("batch tracesPassed", batch.summary.tracesPassed, 1);
            // The rate is the point. `forbidden-tool` fails on the one trace
            // that resolved the skill, and the failing trace is named — a rate
            // with no route back to a session is unactionable.
            const forbidden = batch.evals.find((e) => e.evalName === "forbidden-tool");
            check("forbidden-tool passRate", forbidden?.passRate, 0);
            check("forbidden-tool outliers", forbidden?.failingTraces?.length, 1);
            // Skipped results stay out of the denominator: an artifact nobody
            // invoked must not report a perfect score.
            const empty = batch.evals.find((e) => e.evalName === "doc-writer-wrote-docs");
            check("all-skipped passRate", empty?.passRate, null);
            if (!(empty?.skipReasons ?? []).some((r) => /no subagent turns/.test(r))) {
              console.error("an all-skipped row must keep its reason:", JSON.stringify(empty));
              process.exitCode = 1;
            }
            // Rows are sorted by key on both OS legs, so two runs compare.
            const keys = batch.evals.map((e) => e.key);
            if (JSON.stringify(keys) !== JSON.stringify([...keys].sort())) {
              console.error("aggregate rows are not deterministically ordered");
              process.exitCode = 1;
            }

            // One named trace keeps the single-trace shape.
            const single = read("moose-tracevals-batch-single.json");
            if (single.traces !== undefined || single.trace === undefined) {
              console.error("one named trace must still emit a RunReport");
              process.exitCode = 1;
            }

            // An unreadable trace is an entry, never an abort.
            const degraded = read("moose-tracevals-batch-degraded.json");
            check("degraded traces", degraded.summary.traces, 3);
            check("degraded tracesErrored", degraded.summary.tracesErrored, 1);
            const bad = degraded.traces.find((t) => /bad-trace/.test(t.file));
            if (!bad?.error) {
              console.error("the unreadable trace must carry its error:", JSON.stringify(bad));
              process.exitCode = 1;
            }
            if (!degraded.evals.some((e) => e.evalName === "forbidden-tool")) {
              console.error("one bad trace must not cost the others their verdicts");
              process.exitCode = 1;
            }

            // The budget reached the judge, and the exhaustion is *reported*
            // rather than being an absent row.
            const budget = read("moose-tracevals-batch-budget.json");
            const skipped = budget.evals.filter((e) =>
              (e.skipReasons ?? []).some((r) => /budget exhausted/.test(r)));
            if (skipped.length === 0) {
              console.error("expected budget-exhausted skips across the batch");
              process.exitCode = 1;
            }
            if (budget.evals.some((e) => e.counts.pass > 0 && (e.graders ?? []).includes("ai"))) {
              console.error("an exhausted budget must never produce a judged pass");
              process.exitCode = 1;
            }
          '
          rm -f .tmp/bad-trace.jsonl

          # 5. Discovery selectors. A wide --since matches the fixture store
          #    regardless of checkout time; an empty store must be loud.
          node dist/cli.js run --all-projects --since 520w --limit 5 --project test/fixtures/project --deterministic-only --format json > moose-tracevals-batch-since.json
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-batch-since.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            if (r.summary.traces !== 2) {
              console.error(`expected 2 discovered traces, got ${r.summary.traces}`);
              process.exitCode = 1;
            }
            // A selector always yields the aggregate shape, even for one trace.
            if (!Array.isArray(r.evals)) {
              console.error("a discovery selector must emit a BatchReport");
              process.exitCode = 1;
            }
          '
          # A selector that matched nothing is operational, never a green gate.
          set +e
          MOOSE_TRACEVALS_HOME=test/fixtures/project node dist/cli.js run --all-projects --deterministic-only > /dev/null 2> moose-tracevals-batch-empty.txt
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit 2 when a selector matches no traces, got $code"
            cat moose-tracevals-batch-empty.txt
            exit 1
          fi
          grep -q "no traces matched" moose-tracevals-batch-empty.txt || {
            echo "missing the empty-selection message:"; cat moose-tracevals-batch-empty.txt; exit 1
          }

      - name: Dogfood list (fixture session store)
        shell: bash
        env:
          MOOSE_TRACEVALS_HOME: test/fixtures/home
        run: |
          node dist/cli.js list --all-projects --json --limit 5 > moose-tracevals-list.json
          node -e '
            let raw = require("fs").readFileSync("moose-tracevals-list.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
            const r = JSON.parse(raw);
            if (!Array.isArray(r.traces) || r.traces.length === 0) {
              console.error("expected discovered traces from the fixture home");
              process.exit(1);
            }
          '
