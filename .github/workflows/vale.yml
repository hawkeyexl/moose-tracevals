name: Vale

# Prose lint against the Moose house voice (Voices + Direct). Blocking: the
# whole tree is read on every pull request, and an error fails the check. The
# corpus was worked down to zero first, and `test/fixtures/**` is the one
# exemption (ADR 01033).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          reporter: github-pr-review
          # The whole tree, not only the lines this PR added. Direct.Length
          # reports a long sentence at the line it *starts* on, so an edit
          # further down can push an untouched line over the limit; `added`
          # would never see it. Same for a rename, and for a rule that arrives
          # in a new release of the Moose package.
          filter_mode: nofilter
          # Vale's `error` level blocks. Voices.ColonReveal is a warning
          # upstream, so it annotates without failing. Re-grading it here
          # would fork the voice the package defines.
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
