# Release pipeline. On a push to a release branch, semantic-release reads the
# conventional commits since the last tag, computes the next version, and (when
# warranted) updates CHANGELOG/package.json, tags, creates a GitHub Release, and
# publishes to npm.
#
#   main      -> @latest
#   next      -> @next prerelease
#   feat/**   -> per-branch prerelease channel
#
# OPT-IN. The old blocker is gone: the unpublishable `file:../docevals` link was
# replaced by `@hawkeyexl/inference` from the registry, and the package was
# renamed to `tracevals` because the unscoped name `tracevals`
# belongs to another project on npm. Nothing about the package itself now
# prevents a release.
#
# What remains is one-time setup. Configure npm trusted publishing first, so the
# publish step authenticates without an NPM_TOKEN: on npmjs.com, add a trusted
# publisher for `tracevals` naming this repository and this workflow
# file (release.yml). npm then exchanges the workflow's OIDC token for a
# short-lived, scoped publish credential — which is what `id-token: write` below
# authorizes — and mints provenance automatically. Then:
#
#   gh variable set RELEASE_ENABLED --body true --repo hawkeyexl/tracevals

name: Release

on:
  push:
    branches:
      - main
      - next
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC trusted publishing to npm + provenance

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The husky commit-msg hook isn't useful in CI, and semantic-release's
      # release commit embeds the full changelog (long lines).
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # npm install, not ci — see the lockfile note in CLAUDE.md.
      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
